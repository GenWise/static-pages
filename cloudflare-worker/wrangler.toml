name = "genwise-tomorrow-makers"
main = "worker.js"
compatibility_date = "2026-07-23"
account_id = "ba29d46f8ee8656d9fd01833d973b77d"
workers_dev = false

# Full-site takeover while WordPress is gone (2026-08-01). When the new site is
# ready, repoint DNS and narrow these back to the specific proxied paths.
#
# NOTE: top-level keys must stay ABOVE the [[kv_namespaces]] header. In TOML
# everything after a table header belongs to that table, so putting `routes`
# below it silently folds the routes into the KV binding and wrangler stops
# managing them ("Unexpected fields found in kv_namespaces[0]").
routes = [
  { pattern = "genwise.in/*", zone_name = "genwise.in" },
  { pattern = "www.genwise.in/*", zone_name = "genwise.in" },
  { pattern = "games.genwise.in/*", zone_name = "genwise.in" },
]

# Form submissions are written here BEFORE the notification email is attempted,
# so a mail failure delays a lead instead of destroying it. Every form shares
# this one namespace; keys are `sub:<slug>:<iso>:<rand>`, so one prefix query
# pulls a single form's submissions.
[[kv_namespaces]]
binding = "FORMS_KV"
id = "4b529c7fc9bd48cb86fba2fbf11b1ced"
