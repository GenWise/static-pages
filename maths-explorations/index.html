<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Two Maths Explorations</title>
<meta name="description" content="Godrej Tomorrow Makers × GenWise: two maths explorations to try at home.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<style>
/* Layout: one narrow column for phones; squared-paper bands mark the start of each exploration. */
:root {
  --bg: #F3F5F9; --paper: #FFFFFF; --ink: #1A2332; --muted: #576274; --line: #D5DCE7;
  --navy: #1F3B63; --accent: #DE6B1C; --accent-ink: #FFFFFF; --soft: #EBF0F7;
  --ok: #1B7542; --okbg: #E4F3EA; --warn: #8A5300; --warnbg: #FFF1DC; --no: #A5392A; --nobg: #FCEAE6;
  --gridline: rgba(31, 59, 99, .08);
  --display: "Baloo 2", "Noto Sans", system-ui, sans-serif;
  --body: "Noto Sans", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E131B; --paper: #161E2A; --ink: #E5EAF1; --muted: #9AA5B6; --line: #2A3546;
    --navy: #A9C2E8; --accent: #F08A3E; --accent-ink: #1B1207; --soft: #1D2837;
    --ok: #74D39D; --okbg: #14301F; --warn: #F2BC6B; --warnbg: #33260F; --no: #F29A8C; --nobg: #3A1C17;
    --gridline: rgba(169, 194, 232, .08);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.55 var(--body);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
[hidden] { display: none !important; }
img { max-width: 100%; }
.wrap {
  max-width: 640px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 56px;
}
html[lang="hi"] { --display: "Noto Sans Devanagari", "Noto Sans", sans-serif; }
.langbar { display:flex; align-items:center; justify-content:space-between; gap:10px; max-width:640px; margin:auto; padding:10px 16px; flex-wrap:wrap; }
.langbar button { border:1.5px solid var(--line); padding:8px 14px; border-radius:999px; background:var(--paper); color:var(--ink); min-height:44px; }
.langbar button[aria-pressed="true"] { border-color:var(--accent); background:var(--soft); font-weight:700; }
.storage-status { max-width:608px; margin:0 auto 12px; }
.optional { margin-top:24px; border:1px solid var(--line); border-radius:14px; padding:14px; }
.optional > summary { font-weight:700; color:var(--navy); cursor:pointer; padding:4px; }
.optional .section { margin-top:16px; }
html[lang="hi"] h1, html[lang="hi"] h2, html[lang="hi"] h3 { line-height:1.5; }
h1, h2, h3 { font-family: var(--display); color: var(--navy); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: 2.1rem; }
h2 { font-size: 1.6rem; }
h3 { font-size: 1.25rem; color: var(--accent); }
p { margin: 0; }
b, strong { font-weight: 700; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }

/* brand + hero */
.brand { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 14px 10px; }
.brand .chip { background: #FFFFFF; border-radius: 10px; padding: 6px 10px; display: flex; align-items: center; }
.brand img.gtm { height: 44px; }
.brand img.gw { height: 22px; }
.paperband {
  background-color: var(--paper);
  background-image: linear-gradient(var(--gridline) 1px, transparent 1px), linear-gradient(90deg, var(--gridline) 1px, transparent 1px);
  background-size: 22px 22px;
  border: 1px solid var(--line); border-radius: 14px; padding: 20px 18px;
  display: flex; flex-direction: column; gap: 10px;
}
.eyebrow { font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 700; }

/* sticky bar inside an exploration */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 10px; padding-block: 10px; margin-bottom: 14px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.bar .t { flex: 1; min-width: 0; font-weight: 700; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prog { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.meter { height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); }

/* boxes */
.defs { background: var(--soft); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.section { display: flex; flex-direction: column; gap: 14px; margin-top: 26px; }
.q { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.q.done { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.qlabel { font-size: .78rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.pill { font-size: .78rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--okbg); color: var(--ok); }
.pill.seen { background: var(--warnbg); color: var(--warn); }
.prompt { font-size: 1.02rem; }

/* inputs */
label.fld, div.fld { display: flex; flex-direction: column; gap: 6px; }
.fld > span:first-child { font-weight: 600; font-size: .95rem; }
.inrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
input[type=text], textarea, select {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--bg);
  border: 1.5px solid var(--line); border-radius: 9px; padding: 9px 11px; min-width: 0;
}
input[type=text]:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
input:disabled, textarea:disabled { opacity: .75; }
input.n { width: 6.5em; }
input.s { width: 4.6em; text-align: center; }
textarea { width: 100%; min-height: 4.6em; resize: vertical; }
.unit { color: var(--muted); }
.times { color: var(--muted); font-weight: 700; }
fieldset.choices { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
fieldset.choices legend { font-weight: 600; font-size: .95rem; padding: 0; margin-bottom: 6px; }
label.opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 10px; cursor: pointer; }
label.opt:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
label.opt input { margin-top: 4px; accent-color: var(--accent); }
.reasonhint { font-size: .85rem; color: var(--muted); }

/* buttons */
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
button { font: inherit; cursor: pointer; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; padding: 10px 20px; font-weight: 700; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--navy); border: 1.5px solid var(--line); }
.link { background: none; border: 0; padding: 4px 0; color: var(--navy); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; }
button:focus-visible, .opt:focus-within { outline: 3px solid color-mix(in srgb, var(--accent) 50%, transparent); outline-offset: 2px; }
.why { font-size: .85rem; color: var(--muted); }

/* feedback */
.fb { border-radius: 10px; padding: 11px 14px; border-left: 4px solid; display: flex; flex-direction: column; gap: 6px; }
.fb.ok { background: var(--okbg); border-color: var(--ok); }
.fb.partial { background: var(--warnbg); border-color: var(--warn); }
.fb.no { background: var(--nobg); border-color: var(--no); }
.fb.hint { background: var(--soft); border-color: var(--navy); }
.fb .lead { font-weight: 700; }
.fb ul { margin: 0; padding-left: 1.2em; }
.model { background: var(--soft); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.checks label { display: flex; gap: 8px; align-items: flex-start; }
.checks input { margin-top: 5px; accent-color: var(--ok); }

/* figures */
figure { margin: 0; display: flex; justify-content: center; }
figure svg { width: 100%; max-width: 340px; height: auto; }
.f-land { fill: var(--okbg); }
.f-fence { fill: none; stroke: var(--accent); stroke-width: 5; stroke-dasharray: 12 5; }
.f-wall { fill: var(--no); }
.f-text { fill: var(--ink); font: 700 15px var(--body); }
.f-q { fill: var(--ok); font: 700 44px var(--body); }
.f-walltext { fill: #FFFFFF; font: 700 12px var(--body); letter-spacing: .1em; }
.f-cell { fill: var(--paper); stroke: var(--ink); stroke-width: 2; }
.f-cell.on { fill: var(--soft); }
.f-tick { fill: var(--ok); font: 700 20px var(--body); }
.f-box { fill: var(--accent); font: 700 20px var(--body); }

/* rectangles table */
.rrows { display: flex; flex-direction: column; gap: 8px; }
.rrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.rrow .ix { width: 1.4em; color: var(--muted); font-weight: 700; }
.rrow > label.fld { flex: 1 1 0; min-width: 0; }
.rrow > label.fld > span { font-size: .78rem; min-height: 2.5em; }
.rrow > label.fld > input.n { width: 100% !important; }
.rrow.bad input { border-color: var(--no); }
.rrow.good input { border-color: var(--ok); }
.rmsg { font-size: .85rem; color: var(--no); width: 100%; padding-left: 1.9em; }

/* 3x3 card grid */
.g9 { display: grid; grid-template-columns: 2.4em repeat(3, minmax(0, 1fr)); gap: 6px; align-items: stretch; }
.g9 .ax { font-size: .74rem; color: var(--muted); display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 600; }
.g9 .axtop { grid-column: 2 / 5; justify-content: flex-start; font-weight: 700; color: var(--navy); font-size: .85rem; }
.g9 .axleft { writing-mode: vertical-rl; transform: rotate(180deg); font-weight: 700; color: var(--navy); font-size: .85rem; }
.slot { min-height: 58px; border: 2px dashed var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font-weight: 700; padding: 4px; }
.slot.filled { border-style: solid; border-color: var(--navy); background: var(--paper); }
.slot.target { border-color: var(--accent); }
.tray { display: flex; flex-wrap: wrap; gap: 8px; }
.card { border: 1.5px solid var(--navy); background: var(--paper); color: var(--ink); border-radius: 9px; padding: 8px 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.card.sel { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* data tables */
.tablewrap { overflow-x: auto; }
table.data { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
table.data th, table.data td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; }
table.data th { background: var(--soft); font-size: .85rem; }
table.data td.k { font-weight: 700; }
table.data input { width: 100%; max-width: 6em; padding: 6px 4px; text-align: center; border-radius: 6px; }
table.data tr.bad td { background: var(--nobg); }
table.pct td, table.pct th { padding: 4px 8px; }

/* code breaking */
.msg { display: flex; flex-wrap: wrap; gap: 14px 18px; }
.word { display: flex; gap: 3px; }
.dc { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.dc input { width: 1.9em; height: 2.2em; padding: 0; text-align: center; text-transform: uppercase; font-weight: 700; border-radius: 6px; }
.dc span { font-size: .72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.keystrip { display: grid; grid-template-columns: repeat(auto-fill, minmax(3.1em, 1fr)); gap: 6px; }
.keystrip div { border: 1px solid var(--line); border-radius: 7px; text-align: center; padding: 3px 0; font-variant-numeric: tabular-nums; }
.keystrip b { display: block; min-height: 1.4em; color: var(--accent); }
.keygrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(4.4em, 1fr)); gap: 6px; }
.keygrid label { display: flex; align-items: center; gap: 4px; font-weight: 700; }
.keygrid input { width: 100%; padding: 6px 4px; text-align: center; }
.coded { font-family: ui-monospace, Menlo, Consolas, monospace; background: var(--soft); border-radius: 10px; padding: 12px; word-break: break-word; min-height: 3em; }

/* home */
.excard { display: flex; flex-direction: column; gap: 10px; }
.steps { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; }
.foot { margin-top: 36px; font-size: .8rem; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: no-preference) { .fb { animation: pop .18s ease-out; } @keyframes pop { from { transform: translateY(3px); opacity: .6; } } }
</style>
</head>
<body>
<nav class="langbar" aria-label="Language"><span lang="en">English / <span lang="hi">हिन्दी</span></span><div id="language"><button type="button" data-lang="en" lang="en" aria-pressed="true">English</button> <button type="button" data-lang="hi" lang="hi" aria-pressed="false">हिन्दी</button></div></nav>
<div id="storage-status" class="storage-status fb partial" role="status" hidden></div>
<div class="wrap" id="app"></div>
<script src="hi.js"></script>
<script>
"use strict";
const STORE = "gtm-maths-explorations-v1";

/* ---------- small helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function num(s) {
  if (s == null) return NaN;
  const fractions = { "¼":"1/4", "½":"1/2", "¾":"3/4", "⅐":"1/7", "⅑":"1/9", "⅒":"1/10", "⅓":"1/3", "⅔":"2/3", "⅕":"1/5", "⅖":"2/5", "⅗":"3/5", "⅘":"4/5", "⅙":"1/6", "⅚":"5/6", "⅛":"1/8", "⅜":"3/8", "⅝":"5/8", "⅞":"7/8" };
  let t = String(s).trim().replace(/[०-९]/g, d => String(d.charCodeAt(0) - 0x0966)).replace(/−/g, "-").replace(/⁄/g, "/");
  t = t.replace(/([¼½¾⅐⅑⅒⅓⅔⅕⅖⅗⅘⅙⅚⅛⅜⅝⅞])/g, (c, _, i) => (i && /\d/.test(t[i - 1]) ? " " : "") + fractions[c]);
  if (t.includes(",")) {
    if (!/^[+-]?(?:\d{1,3}(?:,\d{3})+|\d{1,2}(?:,\d{2})*,\d{3})(?:\.\d+)?$/.test(t)) return NaN;
    t = t.replace(/,/g, "");
  }
  let m = t.match(/^([+-]?\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if (m) return +m[3] > 0 ? (m[1].startsWith("-") ? -1 : 1) * (Math.abs(+m[1]) + +m[2] / +m[3]) : NaN;
  m = t.match(/^([+-]?(?:\d+(?:\.\d*)?|\.\d+))(?:\s*\/\s*([+-]?(?:\d+(?:\.\d*)?|\.\d+)))?$/);
  if (!m) return NaN;
  const n = m[2] == null ? +m[1] : (+m[2] === 0 ? NaN : +m[1] / +m[2]);
  return Number.isFinite(n) ? n : NaN;
}
const fmt = x => isFinite(x) ? String(Math.round(x * 100) / 100) : "?";
const near = (a, b, tol) => Math.abs(a - b) <= tol;
const isWhole = x => Number.isFinite(x) && Math.abs(x - Math.round(x)) < 1e-8;
function rect(v, k) {
  const l = num(v[k + ".l"]), b = num(v[k + ".b"]);
  return l > 0 && b > 0 ? { l, b, A: l * b, P: 2 * (l + b) } : null;
}
const rname = r => `${fmt(r.l)} × ${fmt(r.b)}`;

/* ---------- state ---------- */
let storageAvailable = true;
let S = { lang: "en", open: {}, student: { name: "", cls: "", school: "", city: "" }, q: {}, sent: {} };
try { const raw = localStorage.getItem(STORE); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) { storageAvailable = false; }
S.student = Object.assign({name:"",cls:"",school:"",city:""},S.student);
S.lang = S.lang === "hi" ? "hi" : "en";
S.open = S.open || {};
function storageNotice() {
  const el = document.getElementById("storage-status"); if (!el) return;
  el.hidden = storageAvailable;
  el.textContent = "This browser could not save your work. Keep your answers in your notebook and send your work before closing this page.";
  localize(el);
}
function save() {
  try { localStorage.setItem(STORE, JSON.stringify(S)); storageAvailable = true; }
  catch (e) { storageAvailable = false; }
  storageNotice(); return storageAvailable;
}
function ST(id) { return S.q[id] || (S.q[id] = { v: {}, tries: 0, ok: false, hints: 0, sol: false, first: null, log: [] }); }

/* Hindi changes presentation only; answers, IDs and the English cipher stay intact. */
let localePatterns;
function translatedText(text, depth = 0) {
  if (S.lang !== "hi" || !text || depth > 3) return text;
  const key = text.replace(/\s+/g, " ").trim(), catalog = window.HI || {};
  if (!key) return text;
  const pad = value => text.slice(0, text.search(/\S/)) + value + (text.match(/\s*$/) || [""])[0];
  if (Object.prototype.hasOwnProperty.call(catalog, key)) return pad(catalog[key]);
  if (!localePatterns) localePatterns = Object.entries(catalog).filter(([k]) => /\{\d+\}/.test(k)).sort((a,b)=>b[0].replace(/\{\d+\}/g, "").length-a[0].replace(/\{\d+\}/g, "").length).map(([k, value]) => {
    const ids = [];
    const pattern = k.split(/(\{\d+\})/g).map(part => {
      const m = part.match(/^\{(\d+)\}$/);
      if(m){ids.push(+m[1]);return "(.*?)";}
      return part.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }).join("");
    return {re:new RegExp("^"+pattern+"$"), value, ids};
  });
  for (const {re,value,ids} of localePatterns) {
    const match = key.match(re); if (!match) continue;
    // A placeholder must not swallow several joined feedback sentences.
    if(match.slice(1).some(part=>/[.!?]\s+[A-Z]/.test(part)))continue;
    const parts = {}; ids.forEach((id,i)=>parts[id]=translatedText(match[i+1],depth+1));
    return pad(value.replace(/\{(\d+)\}/g,(_,i)=>parts[i] ?? ""));
  }
  const sentences = key.split(/(?<=[.!?])\s+(?=[A-Z])/);
  if(sentences.length>1) return pad(sentences.map(part=>translatedText(part,depth+1)).join(" "));
  return text;
}
function localize(root) {
  if (!root || S.lang !== "hi" || !document.createTreeWalker) return;
  const walker = document.createTreeWalker(root, 4), nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node=>{
    if(node.parentElement?.closest('textarea,script,style,[data-keep-english]'))return;
    node.textContent=translatedText(node.textContent);
  });
  const elements = [root,...root.querySelectorAll("[aria-label],[placeholder]")];
  elements.forEach(el=>{
    if(el.closest?.('[data-keep-english]'))return;
    for(const attr of ["aria-label","placeholder"]){const value=el.getAttribute?.(attr);if(value)el.setAttribute(attr,translatedText(value));}
  });
}

/* ---------- task data ---------- */
const CARDS = [[2, 8], [4, 4], [1, 15], [5, 5], [3, 8], [2, 7], [1, 16], [3, 6], [1, 9]];
const SECRET = [
  [[13, 15, 12, 11, 8, 16], [13, 19], [7, 15, 17, 2, 10]],
  [[13, 6, 11, 18], [14, 19, 1, 17], [11, 18], [2]],
  [[15, 17, 2, 21, 21, 12], [8, 17, 2, 13], [2, 8, 1]],
  [[11, 8, 13, 17, 15, 17, 18, 13, 11, 8, 16]],
  [[3, 2, 12], [13, 19], [17, 20, 4, 21, 19, 15, 17]],
  [[13, 6, 17], [14, 19, 8, 14, 17, 4, 13], [19, 9]],
  [[5, 19, 1, 17]],
];
const KEY = { 1: "D", 2: "A", 3: "W", 4: "P", 5: "M", 6: "H", 7: "B", 8: "N", 9: "F", 10: "K", 11: "I", 12: "Y", 13: "T", 14: "C", 15: "R", 16: "G", 17: "E", 18: "S", 19: "O", 20: "X", 21: "L" };
const SECRET_COUNT = {};
SECRET.flat(2).forEach(n => SECRET_COUNT[n] = (SECRET_COUNT[n] || 0) + 1);
const SECRET_TOTAL = SECRET.flat(2).length;
const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const WORDS = ["a", "an", "and", "are", "as", "at", "by", "do", "for", "go", "I", "if", "in", "is", "it", "of", "on", "or", "so", "that", "the", "then", "this", "to", "too", "will"];
const SAMPLE = "Students at a village school near Nagpur have built a small weather station on the roof of their classroom. It has a rain gauge, a thermometer and a wind vane that the children made from an old plastic bottle. Every morning two students read the instruments and write the numbers on a chart near the door. After three months, the class noticed that the hottest days were not always the driest ones. Their teacher says the project has made the children ask better questions. Now the students want to share their records with farmers in the area, so that families can plan when to sow seeds.";
const SAMPLE_LETTERS = {}; LETTERS.forEach(L => SAMPLE_LETTERS[L] = 0);

function judgeGrid(g, numbers) {
  const rowN = ["top", "middle", "bottom"], colN = ["left", "middle", "right"], out = [];
  for (let r = 0; r < 3; r++) { const a = [0, 1, 2].map(c => g[r * 3 + c].A); if (!(a[0] < a[1] - 1e-9 && a[1] < a[2] - 1e-9)) out.push(`In the ${rowN[r]} row, the area does not get bigger from left to right.`); }
  for (let c = 0; c < 3; c++) { const p = [0, 1, 2].map(r => g[r * 3 + c].P); if (!(p[0] < p[1] - 1e-9 && p[1] < p[2] - 1e-9)) out.push(`In the ${colN[c]} column, the perimeter does not get bigger from top to bottom.`); }
  if (![1, 4, 7].every(i => near(g[i].A, g[4].A, .02))) out.push("The cards in the middle column don't all have the same area.");
  if (![3, 4, 5].every(i => near(g[i].P, g[4].P, .02))) out.push("The cards in the middle row don't all have the same perimeter.");
  if (!out.length) return { ok: true, msg: numbers ? "Every rule works. You built a whole new set of cards." : "Every rule works. Did you notice the card in the centre is in both the middle row and the middle column? That is why it is a good place to start." };

}

function judgeRects(st) {

    if (!String(r.l || "").trim() && !String(r.b || "").trim() && !String(r.p || "").trim()) return null;
    const l = num(r.l), b = num(r.b), p = num(r.p);
    if (!(l > 0 && b > 0)) return { ok: false, msg: "Write a length and a breadth." };
    if (!near(l * b, 24, .02)) return { ok: false, msg: `${fmt(l)} × ${fmt(b)} = ${fmt(l * b)}, not 24.` };
    const key = [Math.min(l, b), Math.max(l, b)].map(x => x.toFixed(3)).join("x");
    if (seen[key] != null) return { ok: false, msg: `This is the same rectangle as number ${seen[key] + 1}, turned around.` };
    seen[key] = i;
    if (!near(p, 2 * (l + b), .02)) return { ok: false, msg: `The sides are right. Check the perimeter: 2 × (${fmt(l)} + ${fmt(b)}).` };
    good++; return { ok: true };
  });

  h += reasonHTML(d, st, "How did you decide where to start?") + (st.ok ? "" : `<div class="actions"><button class="btn" data-act="check" data-q="${d.id}" ${ready(d, st) ? "" : "disabled"}>Check my grid</button></div>`) + fbBox(st);

}

/* Part 1 helpers */
function sourceHTML(d, st) {
  const v = st.v;
  return `<span class="qlabel">${d.label}</span><fieldset class="choices"><legend>Which paragraph are you using?</legend>
    <label class="opt"><input type="radio" name="src" id="src-0" data-q="${d.id}" data-f="src" value="0" ${v.src === 0 ? "checked" : ""}><span>A paragraph from a newspaper or news website</span></label>
    <label class="opt"><input type="radio" name="src" id="src-1" data-q="${d.id}" data-f="src" value="1" ${v.src === 1 ? "checked" : ""}><span>I don't have a newspaper. I'll use the paragraph below.</span></label></fieldset>
    ${v.src === 1 ? `<div class="model"><b>Practice paragraph</b><p lang="en" data-keep-english>${SAMPLE}</p><span class="small muted">This is a made-up news story written for this task. If you use it, the page can also check your counting.</span></div>` : ""}`;
}
const usingSample = () => ((S.q.p1src || {}).v || {}).src === 1;
function freqHTML(d, st) {
  const L = d.what === "letters", keys = L ? LETTERS : WORDS, v = st.v, bad = new Set(st.badRows || []);
  let h = head(d) + `<div class="prompt">${L ? "Write the frequency of each letter, the total, and each percent." : "Count how many times each of these words appears. For the total, count <b>all</b> the words in your paragraph, not just the ones in the table."}</div>`;
  h += `<div class="tablewrap"><table class="data"><thead><tr><th>${L ? "Letter" : "Word"}</th><th>Frequency</th><th>Percent</th></tr></thead><tbody>`;
  keys.forEach(k => {
    h += `<tr class="${bad.has(k) ? "bad" : ""}"><td class="k" data-keep-english>${k}</td><td><input type="text" id="${d.id}-f-${k}" data-q="${d.id}" data-f="f${k}" value="${esc(v["f" + k])}" inputmode="decimal" aria-label="${k} frequency"></td><td><input type="text" id="${d.id}-p-${k}" data-q="${d.id}" data-f="p${k}" value="${esc(v["p" + k])}" inputmode="decimal" aria-label="${k} percent"></td></tr>`;
  });
  h += `<tr><td class="k">${L ? "Total letters" : "Total words"}</td><td><input type="text" id="${d.id}-total" data-q="${d.id}" data-f="total" value="${esc(v.total)}" inputmode="decimal" aria-label="Total"></td><td></td></tr></tbody></table></div>`;
  return h + `<div class="actions"><button class="btn" data-act="check" data-q="${d.id}">Check my table</button></div>` + fbBox(st) + helpBox(d,st);
}
function judgeFreq(d, st) {
  const L = d.what === "letters", keys = L ? LETTERS : WORDS, v = st.v, out = [], bad = new Set();
  const f = k => num(v["f" + k]) || 0;
  const sum = keys.reduce((a, k) => a + f(k), 0), total = num(v.total);
  if (keys.some(k => String(v["f" + k] || "").trim() && (!Number.isInteger(num(v["f" + k])) || num(v["f" + k]) < 0))) return { ok:false,msg:"Frequencies must be whole numbers, zero or more." };
  if (!Number.isInteger(total) || total <= 0) return {ok:false,msg:"The total must be a whole number greater than zero."};
  if (!sum) return { ok: false, msg: "Fill in some frequencies first." };
  if (!(total > 0)) return { ok: false, msg: `Write the total number of ${L ? "letters" : "words"}.` };
  if (L && !near(total, sum, .01)) out.push("Your total does not match your frequency column. Add the column again.");
  if (!L && total < sum) out.push("Your total number of words is smaller than the words counted in your table. Count all the words in the paragraph.");
  if (usingSample()) {
    const truth = L ? SAMPLE_LETTERS : SAMPLE_WORDS, wrong = keys.filter(k => f(k) !== truth[k]);
    wrong.forEach(k => bad.add(k));
    if (wrong.length) out.push(`Recount ${wrong.length === 1 ? "this" : "these"}: ${wrong.slice(0, 8).join(", ")}${wrong.length > 8 ? ` and ${wrong.length - 8} more` : ""}.`);
    const tt = L ? Object.values(SAMPLE_LETTERS).reduce((a, b) => a + b, 0) : SAMPLE_TOKENS.length;
    if (!near(total, tt, .01) && !(L && out.length)) out.push(`Check your total number of ${L ? "letters" : "words"}.`);
  }
  const offPct = keys.filter(k => { const p = String(v["p" + k] || "").trim(); if (!f(k) && !p) return false; return !near(num(p), f(k) / total * 100, .151); });
  offPct.forEach(k => bad.add(k));
  if (offPct.length) out.push(`Check the percent for: ${offPct.slice(0, 8).join(", ")}${offPct.length > 8 ? ` and ${offPct.length - 8} more` : ""}. Percent = frequency ÷ ${L ? "total letters" : "total words"} × 100, rounded to one decimal place.`);
  st.badRows = [...bad];
  if (!out.length) return { ok: true, msg: L ? "Your table is consistent: the total matches and every percent is right for your counts." : "Your word table is consistent." };
  return { ok: false, list: out };
}
function pctTable() {
  const half = Math.ceil(PCT.length / 2);
  let h = `<div class="tablewrap"><table class="data pct"><thead><tr><th>Letter</th><th>Percent</th><th>Letter</th><th>Percent</th></tr></thead><tbody>`;
  for (let i = 0; i < half; i++) { const a = PCT[i], b = PCT[i + half]; h += `<tr><td class="k">${a[0]}</td><td>${a[1]}%</td><td class="k">${b ? b[0] : ""}</td><td>${b ? b[1] + "%" : ""}</td></tr>`; }
  return h + `</tbody></table></div>`;
}

/* tally of the secret message */
function tallyHTML(d, st) {
  const v = st.v, bad = new Set(st.badRows || []);
  let h = head(d) + `<div class="prompt">${d.prompt}</div><div class="tablewrap"><table class="data"><thead><tr><th>Number</th><th>Frequency</th><th>Percent</th></tr></thead><tbody>`;
  for (let n = 1; n <= 21; n++) h += `<tr class="${bad.has(n) ? "bad" : ""}"><td class="k">${n}</td><td><input type="text" id="${d.id}-f-${n}" data-q="${d.id}" data-f="f${n}" value="${esc(v["f" + n])}" inputmode="decimal" aria-label="${n} frequency"></td><td><input type="text" id="${d.id}-p-${n}" data-q="${d.id}" data-f="p${n}" value="${esc(v["p" + n])}" inputmode="decimal" aria-label="${n} percent"></td></tr>`;
  h += `<tr><td class="k">Total</td><td><input type="text" id="${d.id}-total" data-q="${d.id}" data-f="total" value="${esc(v.total)}" inputmode="decimal" aria-label="Total"></td><td></td></tr></tbody></table></div>`;
  return h + `<div class="actions"><button class="btn" data-act="check" data-q="${d.id}">Check my counts</button></div>` + fbBox(st) + helpBox(d,st);
}
function judgeTally(st) {
  const v = st.v, out = [], bad = new Set(), f = n => num(v["f" + n]) || 0;
  if (Array.from({length:21},(_,i)=>i+1).some(n=>String(v["f"+n]||"").trim() && (!Number.isInteger(num(v["f"+n])) || num(v["f"+n])<0))) return {ok:false,msg:"Frequencies must be whole numbers, zero or more."};
  if (!Number.isInteger(num(v.total)) || num(v.total)<=0) return {ok:false,msg:"The total must be a whole number greater than zero."};
  const wrong = []; for (let n = 1; n <= 21; n++) if (f(n) !== SECRET_COUNT[n]) wrong.push(n);
  wrong.forEach(n => bad.add(n));
  if (wrong.length) out.push(`Recount ${wrong.length === 1 ? "this number" : "these numbers"}: ${wrong.slice(0, 8).join(", ")}${wrong.length > 8 ? ` and ${wrong.length - 8} more` : ""}. Tip: cross out each number in your notebook as you count it.`);
  const sum = Array.from({ length: 21 }, (_, i) => f(i + 1)).reduce((a, b) => a + b, 0), total = num(v.total);
  if (!near(total, sum, .01)) out.push("Your total does not match your frequency column. Add the column again.");
  const off = []; if (total > 0) for (let n = 1; n <= 21; n++) { const p = String(v["p" + n] || "").trim(); if (!f(n) && !p) continue; if (!near(num(p), f(n) / total * 100, .151)) off.push(n); }
  off.forEach(n => bad.add(n));
  if (off.length) out.push(`Check the percent for: ${off.slice(0, 8).join(", ")}${off.length > 8 ? ` and ${off.length - 8} more` : ""}.`);
  st.badRows = [...bad];
  if (!out.length) return { ok: true, msg: `All your counts are right: ${SECRET_TOTAL} numbers in all, and your percents match.` };
  return { ok: false, list: out };
}

/* decoder */
function decoderHTML(d, st) {
  const map = st.v.map || (st.v.map = {}), dis = "";
  let h = head(d) + `<div class="prompt">Tap the empty box above a number and type an English letter. It will appear above every matching number. Use the letter percentages to help you guess. Start with the short words.</div><div class="msg">`;
  let pos = 0;
  for (const line of SECRET) for (const w of line) {
    h += `<div class="word">${w.map(n => `<span class="dc"><input type="text" id="dc-${pos++}" data-q="${d.id}" data-n="${n}" value="${esc(map[n] || "")}" maxlength="1" autocapitalize="characters" autocomplete="off" aria-label="Letter for number ${n}" ${dis}><span>${n}</span></span>`).join("")}</div>`;
  }
  h += `</div><div class="keystrip" aria-label="Your key so far">${Array.from({ length: 21 }, (_, i) => `<div>${i + 1}<b data-key="${i + 1}">${esc(map[i + 1] || "")}</b></div>`).join("")}</div>`;
  h += reasonHTML(d, st, "Which number did you crack first, and what clue did you use?");
  h += `<div class="actions"><button class="btn" data-act="check" data-q="${d.id}" ${ready(d, st) ? "" : "disabled"}>Check my letters</button></div>`;
  h += fbBox(st);
  return h + helpBox(d, st);
}
function judgeDecoder(st) {
  const map = st.v.map || {}; let right = 0;
  for (let n = 1; n <= 21; n++) if (map[n] === KEY[n]) right++;
  if (right === 21) return { ok: true, msg: "You cracked it! The mode helped: 17 is the most common number, and E is the most common letter in English." };
  return { ok: right ? "partial" : false, msg: `${right} of the 21 numbers have the right letter. Keep going, and check that the words make sense.` };
}

/* encoder */
function encoderHTML(d, st) {
  const v = st.v, key = v.key || (v.key = {});
  let h = head(d) + `<div class="prompt">1. Make your key: choose a different number or symbol for each English letter.</div><div class="keygrid">`;
  h += LETTERS.map(L => `<label>${L}<input type="text" id="enc-${L}" data-q="${d.id}" data-key="${L}" value="${esc(key[L])}" maxlength="3" aria-label="Code for ${L}"></label>`).join("");
  h += `</div><div id="enc-dup"></div><label class="fld"><span>2. Write a message in English using A–Z. Use at least 50 letters; spaces do not count.</span><textarea id="enc-msg" data-q="${d.id}" data-f="msg" lang="en">${esc(v.msg)}</textarea></label>`;
  h += `<div class="fld"><span>Your message in code</span><div class="coded" id="enc-out" data-keep-english></div><span class="small muted" id="enc-info"></span></div>`;
  h += `<div class="actions"><button class="btn ghost" data-act="copy" data-q="${d.id}">Copy the coded message</button><span class="small muted" id="enc-copied"></span></div>`;
  return h;
}
function encoderUpdate() {
  const st = ST("p5enc"), key = st.v.key || {}, msg = String(st.v.msg || "");
  const out = document.getElementById("enc-out"); if (!out) return;
  const words = msg.toUpperCase().split(/[^A-Z]+/).filter(Boolean);
  out.textContent = words.map(w => w.split("").map(c => key[c] ? key[c] : "?").join(" ")).join("  /  ");
  const letters = words.join("").length, missing = [...new Set(words.join("").split("").filter(c => !key[c]))];
  const otherLetters = [...msg].some(c => /\p{L}/u.test(c) && !/[A-Za-z]/.test(c));
  const codes = {}; LETTERS.forEach(L => { const k = String(key[L] || "").trim(); if (k) (codes[k] = codes[k] || []).push(L); });
  const dups = Object.entries(codes).filter(([, ls]) => ls.length > 1);
  document.getElementById("enc-dup").innerHTML = dups.length ? `<div class="fb partial"><span class="lead">Two letters share a code</span>${dups.map(([k, ls]) => `<p>${ls.join(", ")} both use ${esc(k)}</p>`).join("")}<p>Each letter needs its own code, or your friend can't crack it.</p></div>` : "";
  document.getElementById("enc-info").innerHTML = `<span>${letters} letters</span>` + (missing.length ? `<span>. No code yet for: ${missing.join(", ")}</span>` : "");
  if(otherLetters) document.getElementById("enc-info").innerHTML += `<span> Please use English A–Z letters for your message. You can write your explanation in English or Hindi.</span>`;
  const done = letters >= 50 && !missing.length && !dups.length && !otherLetters;
  localize(document.getElementById("enc-dup")); localize(document.getElementById("enc-info"));
  if (done !== !!st.ok) { st.ok = done; save(); markDone("p5enc"); }
}

/* sending */
function sendHTML(d) {
  const ex = d.ex, [dn, n] = progress(ex), s = S.student, sent = S.sent[ex];
  const missing = !s.name.trim() || !s.cls;
  const [od, on] = progress(ex, true);
  let h = `<p>You have explored ${dn} of ${n} starting questions and ${od} optional questions in ${EX[ex].short}. Send whatever you have tried; you do not need to finish everything.</p><p>GenWise collects the work you send. Please do not expect an individual response. Sending again submits another copy.</p>`;
  if (missing) h += `<p class="small muted">Add your name and class on the start page first.</p>`;
  h += `<div class="actions"><button class="btn" data-act="send" data-q="${d.id}" ${missing ? "disabled" : ""}>Send my work</button>${missing ? `<button class="link" data-act="go" data-to="home">Go to the start page</button>` : ""}</div>`;
  if (sent) h += `<div class="fb ${sent.ok ? "ok" : "no"}" role="status"><p>${sent.ok ? `Sent on ${esc(sent.at)}. Thank you! GenWise has received your work. Please do not expect an individual response.` : esc(sent.err)}</p></div>`;
  if (sent && sent.dirty) h += `<p class="small muted">You have changed your work since your last submission. Send again to share the changes.</p>`;
  return h;
}
function packWork(ex) {
  const items = EX[ex].sections.flatMap(s => s.items).filter(COUNTED), work = {}, lines = [];
  for (const d of items) {
    const st = S.q[d.id]; if (!st) { lines.push(`${d.id}: not started`); continue; }
    work[d.id] = { v: st.v, tries: st.tries, first: st.first, hints: st.hints, sol: st.sol, ok: !!st.ok, revealed: !!st.revealed };
    lines.push(`${d.id}: ${st.ok ? (st.first ? "right first time" : `right after ${st.tries} tries`) : st.sol ? "saw solution" : st.revealed ? "compared with model" : st.tries ? `${st.tries} tries, not yet` : "not started"}${st.hints ? `, ${st.hints} clue(s)` : ""}`);
  }
  return { work, summary: lines.join("\n") };
}
async function send(ex) {
  const s = S.student, [dn, n] = progress(ex), { work, summary } = packWork(ex);
  const body = new URLSearchParams({ page: "maths-explorations", name: s.name, class: s.cls, school: s.school, city: s.city || "", exploration: EX[ex].short, progress: `${dn} of ${n} starting questions; ${progress(ex, true)[0]} optional`, summary, work: JSON.stringify(work) });
  try {
    if (location.protocol === "file:") throw new Error("local");
    const r = await fetch("/api/forms/maths-explorations", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: body.toString() });
    if (!r.ok) throw new Error(String(r.status));
    S.sent[ex] = { ok: true, at: new Date().toLocaleString() };
  } catch (e) {
    S.sent[ex] = { ok: false, err: "Could not send. Check your internet connection and try again. Keep your answers in your notebook. If browser storage is available, your work is also saved here." };
  }
  save(); refresh("send-" + ex);
}

/* ---------- updating ---------- */
function invalidate(id) {
  const st = ST(id), d = DEF[id];
  st.ok = false; delete st.kind; delete st.msg; delete st.list; delete st.badRows;
  if (S.sent[d.ex]) S.sent[d.ex].dirty = true;
  const el = document.getElementById("q-" + id);
  if (el) { el.querySelectorAll(".fb:not(.hint)").forEach(x => x.remove()); const pill=el.querySelector(".pill"); if(pill && !st.sol && !st.revealed) pill.remove(); }
  if (id === "p1let" || id === "p1src") {
    const dep = S.q.p1q1; if(dep){dep.ok=false;delete dep.kind;delete dep.lastSig;refresh("p1q1");}
  }
  markDone(id);
}
function refresh(id) {
  const el = document.getElementById("q-" + id); if (!el) return;
  el.innerHTML = inner(DEF[id]); el.classList.toggle("done", isDone(DEF[id]));
  if (id === "p5enc") encoderUpdate();
  localize(el);
}
function markDone(id) {
  const el = document.getElementById("q-" + id); if (el) el.classList.toggle("done", isDone(DEF[id]));
  const p = document.getElementById("prog"), ex = DEF[id] && DEF[id].ex;
  if (p && ex) { const [d, n] = progress(ex); p.textContent = `${d} of ${n} starting questions explored`; localize(p); }
  if (ex) refresh("send-" + ex);
}
function updateReady(id) {
  const d = DEF[id], st = ST(id), b = document.querySelector(`#q-${id} [data-act="check"], #q-${id} [data-act="reveal"]`);
  if (b && ["ask", "open", "grid9", "decoder"].includes(d.type)) b.disabled = !ready(d, st);
  const w = document.getElementById(id + "-why"); if (w) { w.textContent = reasonShort(d, st) ? "Write your reason to check." : ""; localize(w); }
}
function check(id) {
  const d = DEF[id], st = ST(id);
  let res;
  if (d.type === "rects") res = judgeRects(st);
  else if (d.type === "grid9") { const g = [...Array(9).keys()].map(i => { const [l, b] = CARDS[st.v.place[i]]; return { l, b, A: l * b, P: 2 * (l + b) }; }); res = judgeGrid(g, false); st.lastSig = JSON.stringify([st.v.place, st.v._reason]); }
  else if (d.type === "freq") res = judgeFreq(d, st);
  else if (d.type === "tally") res = judgeTally(st);
  else if (d.type === "decoder") res = judgeDecoder(st);
  else { res = d.judge(st.v); st.lastSig = sig(d, st); }
  st.tries++;
  if (st.first == null) st.first = res.ok === true;
  st.log.push({ at: Date.now(), ok: res.ok, v: JSON.parse(JSON.stringify(st.v)) });
  if (st.log.length > 30) st.log.shift();
  st.ok = res.ok === true;
  st.kind = res.ok === true ? "ok" : res.ok === "partial" ? "partial" : "no";
  st.msg = res.msg; st.list = res.list;
  save(); refresh(id); markDone(id);
}

app.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.st) { S.student[el.dataset.st] = el.value; save(); return; }
  if (el.type === "checkbox" && el.dataset.q) { ST(el.dataset.q).v[el.dataset.f] = el.checked; save(); return; }
  if (el.type !== "radio" || !el.dataset.q) return;
  const id = el.dataset.q; invalidate(id); ST(id).v[el.dataset.f] = +el.value; save(); refresh(id);
  if (id === "p1src") { for(const q of ["p1let","p1wrd"]){invalidate(q);refresh(q);} }
});

render();
</script>
